name: Build BlazeNeuro OS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools mtools isolinux qemu-system-x86 libgtk-3-dev build-essential pkg-config
      
      - name: Fix configs
        run: |
          sudo sed -i 's/LB_MODE="ubuntu"/LB_MODE="debian"/' config/live-build/config/common
          sudo sed -i 's/LB_KEYRING_PACKAGES="ubuntu-keyring"/LB_KEYRING_PACKAGES="debian-archive-keyring"/' config/live-build/config/chroot
          sudo sed -i 's/LB_LINUX_PACKAGES="linux"/LB_LINUX_PACKAGES="linux-image"/' config/live-build/config/chroot
          sed -i 's/flat-remix-gtk/arc-theme/' config/live-build/config/package-lists/blazeneuro.list.chroot
          sed -i 's/flat-remix-icon-theme/papirus-icon-theme/' config/live-build/config/package-lists/blazeneuro.list.chroot
      
      - name: Build C components
        run: |
          cd src/optimizer && make
          cd ../gui-suite && make
      
      - name: Build ISO
        run: sudo ./scripts/build_iso.sh
      
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: blazeneuro-os-iso
          path: config/live-build/*.iso
